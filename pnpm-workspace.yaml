overrides:
  is-core-module: npm:@nolyfill/is-core-module@^1
  safe-buffer: npm:@nolyfill/safe-buffer@^1

autoInstallPeers: false
strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # The adapter works with Superstruct 2, but its published peer range only declares 1.x.
    '@farfetched/superstruct>superstruct': ^2.0.2

allowBuilds:
  esbuild: true
